# ============================================================================
# jax-hfbfft Configuration File
# ============================================================================
# This file controls all aspects of the Hartree-Fock-Bogoliubov calculation.
# Edit the parameters below and run: python run_hfb.py
# Results will be written to the output directory specified below.

# ----------------------------------------------------------------------------
# NUCLEUS CONFIGURATION
# ----------------------------------------------------------------------------
nucleus:
  # Number of protons and neutrons in the nucleus
  protons: 92        # Z (atomic number)
  neutrons: 146       # N (neutron number)
  
  # Name for output files (optional, auto-generated if not provided)
  name: "U238"       # e.g., "O16", "Sn132", "Pb208"

# ----------------------------------------------------------------------------
# FORCE PARAMETERS
# ----------------------------------------------------------------------------
force:
  # Skyrme force name: SLy4, SLy5, SkM*, SkP, SV-min, UNEDF0, UNEDF1, UNEDF2
  name: "SLy4"
  
  # Pairing interaction type:
  #   0 = No pairing (pure Hartree-Fock)
  #   5 = Volume Delta Interaction (VDI)
  #   6 = Density-Dependent Delta Interaction (DDDI, recommended)
  ipair: 6
  
  # Use BCS approximation (true) or HFB (false)
  # BCS is faster and usually sufficient; HFB allows for more complex pairing
  use_bcs: false
  
  # Pairing strength (MeV·fm³)
  # Negative values use force-specific defaults
  # Typical values: 300-400 for medium-mass nuclei
  v0_neutron: 362    # Neutron pairing strength
  v0_proton: 362    # Proton pairing strength
  
  # Density at which DDDI pairing strength is half of surface value (fm⁻³)
  # Only used with ipair=6 (DDDI)
  rho0_pairing: 0.32  # Typical nuclear saturation density
  
  # Energy cutoff for pairing window (MeV)
  # Only states within this energy from Fermi surface participate in pairing
  # Larger values = more states, longer computation
  pairing_cutoff: [0.0, 0.0]  # [neutron, proton] — 0 = no cutoff (legacy default)

  # State cutoff for wstates soft weight (MeV above Fermi energy)
  # States beyond eferm + state_cutoff get a soft weight < 1 applied to wstates
  # Legacy default: [15.0, 15.0]
  state_cutoff: [15.0, 15.0]  # [neutron, proton]
  
  # Include center-of-mass correction (recommended: true)
  include_cm_correction: true

# ----------------------------------------------------------------------------
# GRID CONFIGURATION
# ----------------------------------------------------------------------------
grid:
  # Number of grid points in each direction
  # Must be even numbers; larger = more accurate but slower
  # Typical: 16-24 for light nuclei, 24-32 for medium, 32-48 for heavy
  nx: 32
  ny: 32
  nz: 32
  
  # Grid spacing in each direction (fm)
  # Smaller = more accurate but needs larger box
  # Typical: 0.8-1.0 fm for most calculations
  # If not specified, auto-determined from nucleus size
  dx: .8  # null = auto-determine
  dy: .8
  dz: .8
  
  # Box size (fm) - alternative to specifying dx/dy/dz
  # Specify either spacing OR box size, not both
  # box_x: 24.0
  # box_y: 24.0
  # box_z: 24.0

# ----------------------------------------------------------------------------
# BASIS CONFIGURATION
# ----------------------------------------------------------------------------
basis:
  # Number of single-particle states to include in calculation
  # If null, auto-determined based on nucleus and pairing
  # For no pairing: typically set equal to N and Z
  # For pairing: use 2-3× the particle number for convergence
  npsi_neutron: 292  # null = auto-determine
  npsi_proton: 184   # null = auto-determine
  
  # Manual specification (overrides auto)
  # npsi_neutron: 16
  # npsi_proton: 16

# ----------------------------------------------------------------------------
# INITIALIZATION
# ----------------------------------------------------------------------------
initialization:
  # Method for initializing wavefunctions:
  #   "harmonic_oscillator" - Spherical HO basis (standard, recommended)
  #   "woods_saxon" - Woods-Saxon potential
  #   "random" - Random wavefunctions (for testing)
  method: "harmonic_oscillator"
  
  # Harmonic oscillator parameters (only for method="harmonic_oscillator")
  # Oscillator length parameters in fm
  # Typical: 2.5-3.5 fm for medium-mass nuclei
  ho_length_x: 3.1
  ho_length_y: 3.1
  ho_length_z: 3.1

# ----------------------------------------------------------------------------
# ITERATION CONTROL
# ----------------------------------------------------------------------------
iteration:
  # Maximum number of iterations
  max_iterations: 1200
  
  # Convergence threshold (MeV)
  # Calculation stops when energy fluctuation < threshold
  # Typical: 1e-5 to 1e-7 for production runs
  convergence_threshold: 1.0e-20
  
  # Gradient descent damping parameter
  # Controls step size in imaginary time evolution
  # Smaller = more stable but slower; typical: 0.3-0.5
  x0dmp: 0.45
  
  # Preconditioning energy scale (MeV)
  # Typical: 20-100 MeV
  e0dmp: 100.0
  
  # Density mixing parameter (0.0 to 1.0)
  # Fraction of new density mixed with old
  # Smaller = more stable; typical: 0.3-0.7
  # Legacy value: 0.2
  density_mixing: 0.2
  
  # Full diagonalization for iterations <= diag_start (legacy inidiag)
  # Legacy run uses inidiag=30: tdiag=True for the first 30 main-loop iterations.
  diag_start: 30

  # BCS mode for iterations <= bcs_start (legacy inibcs)
  # Legacy run uses inibcs=30: tbcs=True (uniform weights, forced tdiag) for
  # the first 30 main-loop iterations, then switches to full HFB.
  bcs_start: 30

  # Adaptive x0dmp (tvaryx_0): triple x0dmp before main loop and adapt each iteration
  # Legacy run config (_config.yml) sets tvaryx_0: true
  tvaryx_0: true

# ----------------------------------------------------------------------------
# PHYSICS OPTIONS
# ----------------------------------------------------------------------------
physics:
  # Include Coulomb interaction for protons
  include_coulomb: true
  
  # Time-reversal symmetry (true = even-even nuclei, standard)
  time_reversal: true
  
  # Include time-odd terms in mean field
  # Usually false for ground states, true for odd-mass or rotating nuclei
  time_odd: false

# ----------------------------------------------------------------------------
# OUTPUT CONTROL
# ----------------------------------------------------------------------------
output:
  # Base directory for output files
  # Will create subdirectory: output_dir/nucleus_name/
  output_dir: "hfb_results"
  
  # Print interval (iterations)
  # Print progress every N iterations
  print_interval: 50

  # Single-particle info (sinfo) print interval (iterations)
  # How often to print the detailed sinfo block (Fermi energies, pairing, etc.)
  sinfo_interval: 50
  
  # Save detailed results files
  save_convergence: true      # Iteration-by-iteration convergence data
  save_energies: true          # Detailed energy breakdowns
  save_densities: true         # Spatial density distributions
  save_moments: true           # Multipole moments (monopole, dipole, quadrupole)
  save_radii: true             # RMS radii and deformation parameters
  save_single_particle: true   # Single-particle spectra
  save_pairing: true           # Pairing properties
  save_wavefunctions: false    # Full wavefunctions (large files!)
  
  # Write final summary to stdout
  verbose: true
  
  # Create plots (requires matplotlib)
  make_plots: false

# ----------------------------------------------------------------------------
# ADVANCED OPTIONS (usually don't need to change)
# ----------------------------------------------------------------------------
advanced:
  # JAX precision (32 or 64)
  # Use 64 for production runs, 32 for faster testing
  precision: 64
  
  # JAX device (cpu, gpu, or tpu)
  # null = auto-detect
  device: null
  
  # Enable JAX JIT compilation
  use_jit: true
  
  # Random seed for reproducibility (if using random initialization)
  random_seed: 42
  
  # Restart from previous calculation
  restart: false
  restart_file: null

# ----------------------------------------------------------------------------
# CONSTRAINT OPTIONS (for constrained calculations)
# ----------------------------------------------------------------------------
# Uncomment and configure to perform constrained HFB calculations
# constraints:
#   # =========================================================================
#   # OPTION 1: MULTIPOLE CONSTRAINTS (Direct specification)
#   # =========================================================================
#   # Constrain arbitrary multipole moments Q_λμ
#   # Can specify by name (Q20, Q30, Q22, etc.) or by quantum numbers
#   #
#   # Common multipole names:
#   #   Q00: Monopole (λ=0, μ=0)
#   #   Q10: Dipole (λ=1, μ=0)
#   #   Q20: Quadrupole axial (λ=2, μ=0) - most common
#   #   Q22: Quadrupole triaxial (λ=2, μ=2)
#   #   Q30: Octupole (λ=3, μ=0)
#   #   Q40: Hexadecapole (λ=4, μ=0)
#   #   Q50, Q60: Higher multipoles
#   #
#   # Units: fm^λ (e.g., Q20 in fm², Q30 in fm³)
#   #
#   # Examples:
#   
#   # Single Q20 constraint (prolate deformation)
#   # multipoles:
#   #   Q20: 5.0
#   
#   # Multiple constraints (Q20 + Q30 + triaxial Q22)
#   # multipoles:
#   #   Q20: 5.0    # Quadrupole (fm²)
#   #   Q30: 2.0    # Octupole (fm³)
#   #   Q22: 1.0    # Triaxiality (fm²)
#   
#   # Using tuple notation for arbitrary multipoles
#   # Format: [lambda, mu] for Q_λμ
#   # multipoles:
#   #   Q20: 5.0        # Standard name
#   #   [3, 0]: 2.0     # Same as Q30
#   #   [4, 0]: 1.0     # Q40 (hexadecapole)
#   #   [5, 1]: 0.5     # Q51 (arbitrary higher multipole)
#   
#   # =========================================================================
#   # OPTION 2: BETA-GAMMA PARAMETERS (Hill-Wheeler parameterization)
#   # =========================================================================
#   # Alternative way to specify deformation using standard β-γ notation
#   # Automatically converts to multipole moments
#   #
#   # Parameters:
#   #   beta2: Quadrupole deformation parameter
#   #          Positive = prolate (football shape, elongated)
#   #          Negative = oblate (pancake shape, flattened)
#   #          Typical magnitude: 0.0 (spherical) to 0.6 (superdeformed)
#   #   gamma: Triaxiality angle in degrees (optional for axial shapes)
#   #          0° = axially symmetric
#   #          0-60° = triaxial (asymmetric)
#   #   beta3: Octupole deformation (pear shape, typically 0.0-0.2)
#   #   beta4: Hexadecapole deformation (necking, typically 0.0-0.1)
#   #   r0: Radius parameter in fm (default: 1.2)
#   #
#   # Examples:
#   
#   # Prolate deformation (football shape)
#   # beta_gamma:
#   #   beta2: 0.25
#   
#   # Oblate deformation (pancake shape) - using negative beta
#   # beta_gamma:
#   #   beta2: -0.20
#   
#   # Oblate (alternative using gamma=60)
#   # beta_gamma:
#   #   beta2: 0.20
#   #   gamma: 60
#   
#   # Triaxial deformation
#   # beta_gamma:
#   #   beta2: 0.30
#   #   gamma: 30
#   
#   # Octupole deformation (pear shape, e.g., Ra-224)
#   # beta_gamma:
#   #   beta2: 0.10
#   #   beta3: 0.08
#   #   gamma: 0
#   
#   # Superdeformed (high-spin states)
#   # beta_gamma:
#   #   beta2: 0.60
#   #   gamma: 0
#   
#   # =========================================================================
#   # PRINCIPAL AXES ALIGNMENT
#   # =========================================================================
#   # Enforce alignment with principal axes (adds 6 constraints)
#   # Useful for triaxial systems to prevent rotation
#   # principal_axes: false
#   
#   # =========================================================================
#   # ALGORITHM PARAMETERS (advanced users)
#   # =========================================================================
#   # c0constr: 0.8       # Q-corrective step parameter
#   # qepsconstr: 0.3     # Lagrange multiplier update rate
#   # dampgamma: 1.0      # Damping for masking function
#   # damprad: 6.0        # Damping radius (fm)

