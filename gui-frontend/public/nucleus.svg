<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <radialGradient id="nucleusGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>
  <!-- Nucleus center -->
  <circle cx="50" cy="50" r="25" fill="url(#nucleusGrad)"/>
  <!-- Orbital rings -->
  <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6" transform="rotate(60 50 50)"/>
  <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" transform="rotate(120 50 50)"/>
  <!-- Electron dots -->
  <circle cx="90" cy="50" r="4" fill="#3b82f6"/>
  <circle cx="30" cy="15" r="4" fill="#ef4444"/>
  <circle cx="30" cy="85" r="4" fill="#10b981"/>
</svg>
