[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-hfbfft"
version = "0.1.0"
description = "JAX-based Hartree-Fock-Bogoliubov solver with Fast Fourier Transform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ASCSN", email = "ascsn@example.com"}
]
maintainers = [
    {name = "ASCSN", email = "ascsn@example.com"}
]
keywords = [
    "nuclear physics",
    "hartree-fock",
    "hartree-fock-bogoliubov",
    "HFB",
    "JAX",
    "GPU",
    "nuclear structure",
    "Skyrme",
    "mean-field"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
# GPU support with CUDA
cuda = [
    "jax[cuda12]>=0.4.0",
]
cuda11 = [
    "jax[cuda11]>=0.4.0",
]
# GPU support with Metal (Apple Silicon)
metal = [
    "jax-metal>=0.0.5",
]
# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
    "ruff>=0.1",
]
# Documentation
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=1.0",
    "nbsphinx>=0.9",
]
# Visualization
viz = [
    "matplotlib>=3.5",
]
# GUI (web-based interface)
gui = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=11.0",
    "pydantic>=2.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.6",
    "psutil>=5.9.0",
]
# All optional dependencies
all = [
    "jax-hfbfft[dev,docs,viz,gui]",
]

[project.urls]
Homepage = "https://github.com/ascsn/jax-hfbfft"
Documentation = "https://jax-hfbfft.readthedocs.io"
Repository = "https://github.com/ascsn/jax-hfbfft.git"
Issues = "https://github.com/ascsn/jax-hfbfft/issues"
Changelog = "https://github.com/ascsn/jax-hfbfft/blob/main/CHANGELOG.md"

[project.scripts]
jax-hfbfft = "jax_hfbfft.cli:main"
hfbfft = "jax_hfbfft.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jax_hfbfft*"]

[tool.setuptools.package-data]
jax_hfbfft = ["data/*.yml", "data/*.yaml", "gui/frontend/**/*", "gui/frontend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
