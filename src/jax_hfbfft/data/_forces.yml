# Skyrme Force Parameterizations for JAX-HFBFFT
#
# This file contains the standard Skyrme parameters for various forces.
# Parameters are in standard nuclear physics units:
#   - t0, t1, t2, t3 in MeV·fm^3, MeV·fm^5, MeV·fm^5, MeV·fm^(3+3α)
#   - x0, x1, x2, x3 are dimensionless
#   - t4 and b4p (spin-orbit) in MeV·fm^5: b4 = t4/2 and b4' = b4p, so a standard
#     Skyrme force with strength W0 has t4 = W0 and b4p = W0/2
#   - power (α) is dimensionless
#   - h2m is ℏ²/2m in MeV·fm²
#   - zpe selects the centre-of-mass correction: 0 = h2m*(1-1/A), 1 = 17.3/A^0.2,
#     2 = none, 3 = microscopic <P^2>/2mA on the final state (SkyAx zpe=1)
#   - j2 adds J^2 (tensor) terms: 'central' for those of the Skyrme central force,
#     or [CJ0, CJ1] as coefficients of sum J_mu,nu^2 (HFBTHO's CJ)

SLy4:
  description: "Standard Lyon Skyrme parameterization"
  reference: "Chabanat et al., Nucl. Phys. A 635 (1998) 231"
  ex: 1
  zpe: 0
  h2m: [20.73553, 20.73553]
  t0: -2488.913
  t1: 486.818
  t2: -546.395
  t3: 13777.0
  t4: 123.0
  x0: 0.834
  x1: -0.344
  x2: -1.0
  x3: 1.354
  b4p: 61.5
  power: 0.16666666666666666  # 1/6

